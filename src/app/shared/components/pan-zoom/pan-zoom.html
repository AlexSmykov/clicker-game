<div class="content" [style.transform]="transform()">
  <ng-content />
</div>

<div class="controls" (pointerdown)="$event.stopPropagation()">
  <button class="control" type="button" aria-label="Zoom in" (click)="zoomBy(1.25)">+</button>
  <button class="control" type="button" aria-label="Zoom out" (click)="zoomBy(0.8)">−</button>
  <button class="control" type="button" aria-label="Reset view" (click)="reset()">1:1</button>
</div>
