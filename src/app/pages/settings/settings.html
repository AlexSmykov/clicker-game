<div class="actions">
  <button type="button" (click)="save()" (blur)="clearSaved()">{{ saveLabel() }}</button>

  <button type="button" (click)="resetSettings()">Reset settings</button>

  <button
    class="danger"
    type="button"
    [class.confirm]="isResetConfirming()"
    (click)="reset()"
    (blur)="cancelReset()"
  >
    {{ isResetConfirming() ? 'Click again to confirm' : 'Reset progress' }}
  </button>
</div>

<div class="groups">
  @for (group of groups(); track group.key) {
    <details class="group" open>
      <summary class="group-title">{{ group.name }}</summary>

      <div class="settings">
        @for (setting of group.settings; track setting.key) {
          <app-checkbox
            [label]="setting.name"
            [isChecked]="setting.isOn"
            (changed)="setSetting(setting.key, $event)"
          />
        }
      </div>
    </details>
  }
</div>
